name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      filename: ${{ steps.pack.outputs.filename }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.1
          package-manager-cache: false

      - name: Verify the release tag
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "::error::Release tag must be exactly ${expected_tag}."
            exit 1
          fi
          tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
            echo "::error::Release tag must point to a commit reachable from origin/main."
            exit 1
          fi
          test "$(npm --version)" = "11.16.0"

      - name: Refuse an already-published version
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          lookup_error="$RUNNER_TEMP/npm-view-error.txt"
          if npm view "${package_name}@${package_version}" version --json > /dev/null 2> "$lookup_error"; then
            echo "::error::${package_name}@${package_version} is already published; refusing to publish it again."
            exit 1
          fi
          if ! grep -Eq 'E404|404 Not Found' "$lookup_error"; then
            echo "::error::Could not confirm that ${package_name}@${package_version} is unpublished."
            exit 1
          fi

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=low

      - name: Pack and inspect the release artifact
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/npm-pack.json"
          npm pack --json --pack-destination "$RUNNER_TEMP" > "$report"
          PACK_REPORT="$report" node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { appendFileSync, readFileSync } from "node:fs";
          import { join } from "node:path";

          const report = JSON.parse(readFileSync(process.env.PACK_REPORT, "utf8"));
          if (!Array.isArray(report) || report.length !== 1 || report[0].error) {
            throw new Error("npm pack did not produce exactly one artifact");
          }

          const artifact = report[0];
          const expectedFiles = new Set([
            "LICENSE",
            "PRIVACY.md",
            "README.md",
            "SECURITY.md",
            "completions/_slack-axi",
            "completions/slack-axi.bash",
            "dist/actions.js",
            "dist/app.js",
            "dist/auth.js",
            "dist/cache.js",
            "dist/cli.js",
            "dist/config.js",
            "dist/domain.js",
            "dist/errors.js",
            "dist/fs-store.js",
            "dist/identity.js",
            "dist/index.js",
            "dist/keychain.js",
            "dist/lease-outcome.js",
            "dist/message-text.js",
            "dist/metadata.js",
            "dist/mutations.js",
            "dist/output.js",
            "dist/owned-lock.js",
            "dist/paths.js",
            "dist/policy.js",
            "dist/process-identity.js",
            "dist/refs.js",
            "dist/slack-browser.js",
            "dist/slack-public.js",
            "dist/time.js",
            "dist/types.js",
            "dist/version.js",
            "docs/slack-axi.1",
            "npm-shrinkwrap.json",
            "package.json",
            "slack-app-manifest.json",
          ]);
          const artifactFiles = artifact.files.map(({ path }) => path);
          const missing = [...expectedFiles].filter((path) => !artifactFiles.includes(path));
          const unexpected = artifactFiles.filter((path) => !expectedFiles.has(path));
          if (missing.length > 0 || unexpected.length > 0) {
            throw new Error(`release artifact manifest mismatch; missing: ${missing.join(", ") || "none"}; unexpected: ${unexpected.join(", ") || "none"}`);
          }
          if (!/^[A-Za-z0-9._-]+\.tgz$/.test(artifact.filename)) {
            throw new Error("npm pack returned an unsafe artifact filename");
          }
          const bytes = readFileSync(join(process.env.RUNNER_TEMP, artifact.filename));
          const sha256 = createHash("sha256").update(bytes).digest("hex");
          appendFileSync(process.env.GITHUB_OUTPUT, `filename=${artifact.filename}\nsha256=${sha256}\n`);
          NODE
          git diff --exit-code -- completions docs

      - name: Install and exercise the packed executable
        shell: bash
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/slack-axi-install"
          package_version="$(node -p "require('./package.json').version")"
          npm install --prefix "$install_root" "$RUNNER_TEMP/${{ steps.pack.outputs.filename }}"
          installed="$install_root/node_modules/.bin/slack-axi"
          test "$("$installed" --version)" = "$package_version"
          "$installed" --help > /dev/null
          node --input-type=module <<'NODE'
          import { access } from "node:fs/promises";
          import { homedir } from "node:os";
          import { join } from "node:path";

          const slackAxiPaths = [
            join(homedir(), "Library", "Application Support", "slack-axi"),
            join(homedir(), "Library", "Caches", "slack-axi"),
          ];
          for (const path of slackAxiPaths) {
            try {
              await access(path);
            } catch (error) {
              if (error && typeof error === "object" && "code" in error && error.code === "ENOENT") continue;
              throw error;
            }
            throw new Error(`release runner is not clean: ${path} already exists`);
          }
          NODE
          "$installed" --output json | grep -q '"status": "setup_required"'

      - name: Upload the verified npm package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-${{ github.sha }}
          path: ${{ runner.temp }}/${{ steps.pack.outputs.filename }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: verify
    runs-on: macos-15
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.1
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Download the verified npm package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-${{ github.sha }}
          path: ${{ runner.temp }}/npm-package

      - name: Verify the transferred package
        shell: bash
        env:
          PACKAGE_FILENAME: ${{ needs.verify.outputs.filename }}
          EXPECTED_SHA256: ${{ needs.verify.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$PACKAGE_FILENAME" =~ ^[A-Za-z0-9._-]+\.tgz$ ]]
          [[ "$EXPECTED_SHA256" =~ ^[a-f0-9]{64}$ ]]
          package_path="$RUNNER_TEMP/npm-package/$PACKAGE_FILENAME"
          test -f "$package_path"
          actual_sha256="$(shasum -a 256 "$package_path" | awk '{print $1}')"
          test "$actual_sha256" = "$EXPECTED_SHA256"

      - name: Verify the bundled publisher npm
        shell: bash
        run: |
          set -euo pipefail
          test "$(npm --version)" = "11.16.0"

      - name: Publish to npm
        env:
          # Bootstrap the first release with NPM_TOKEN. npm prefers GitHub OIDC
          # after the package's trusted publisher is configured, so remove the
          # secret immediately after that migration.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_FILENAME: ${{ needs.verify.outputs.filename }}
        run: npm publish "$RUNNER_TEMP/npm-package/$PACKAGE_FILENAME" --access public --provenance
